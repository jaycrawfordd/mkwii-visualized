name: Refresh MKW Lounge data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKW_KNOWN_MAX_LADDER_ID: "20"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Discover current RT and CT seasons
        id: ladders
        run: npm run data:discover

      - name: Restore historical CSV cache
        id: csv-cache
        uses: actions/cache@v6
        with:
          path: work/csv
          key: mkw-lounge-csv-${{ runner.os }}-${{ steps.ladders.outputs.max_ladder_id }}-${{ hashFiles('work/download-ladders.mjs', 'work/build-dashboard-data.mjs', 'work/build-almia-upper-data.mjs', 'work/almia-upper-tournament.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Download current exports and restore archive
        run: npm run data:download

      - name: Build dashboard data
        run: npm run data:build

      - name: Test production build
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name mkw-lounge-ladder-lab
